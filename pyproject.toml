[project]
name = "boss-zhipin-pure-python"
version = "1.4.2"
description = "BOSS直聘岗位抓取、可选 LLM 语义判断与代码化公司聚合 CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0,<3.0.0",
    "websocket-client>=1.6.0,<2.0.0",
]

[project.scripts]
boss-scraper = "scripts.boss_cdp_raw:main"
boss-batch-search = "scripts.batch_search:main"
boss-web = "scripts.web_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.hatch.build.targets.wheel.force-include]
"data/city_codes.json" = "data/city_codes.json"
"examples/search_rules.csv" = "examples/search_rules.csv"
"examples/keyword_rules.csv" = "examples/keyword_rules.csv"
"examples/company_rules.csv" = "examples/company_rules.csv"
"examples/robotics_keyword_rules.csv" = "examples/robotics_keyword_rules.csv"
"examples/ai_keyword_rules.csv" = "examples/ai_keyword_rules.csv"
"examples/frontier_tech_keyword_rules.csv" = "examples/frontier_tech_keyword_rules.csv"
"examples/healthcare_keyword_rules.csv" = "examples/healthcare_keyword_rules.csv"
"web/index.html" = "web/index.html"
